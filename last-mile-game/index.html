<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shiplyp: Last Mile — Indian Courier 3D Action Driving</title>
  <meta name="description" content="Action-packed 3D Indian last-mile courier delivery driving game across Mumbai, Delhi, Kolkata, Pune & Bengaluru.">
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Three.js 3D Library with Multi-CDN Fallback -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>');
    }
  </script>

  <!-- Post-processing pipeline: bloom + SSAO for cinematic look -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/FXAAShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'style.css?t=' + Date.now();
    document.head.appendChild(l);
  </script>
</head>
<body>
  <div id="game-app">
    <!-- WebGL Canvas Container -->
    <div id="webgl-container"></div>

    <!-- 1. SLOWROADS MINIMALIST HUD ARCHITECTURE -->
    <div id="in-game-hud" class="hud-overlay">
      <!-- Top-Right: Slowroads Minimal Audio Bar & System Controls -->
      <div class="slowroads-top-bar">
        <div class="slowroads-radio-pill" id="cassette-radio-card">
          <span class="radio-label">RADIO</span>
          <span class="radio-sep">/</span>
          <button id="btn-radio-channel" class="radio-channel-btn" title="Switch Channel [L]">DHABA FM</button>
          <button id="btn-radio-lang" class="radio-channel-btn" title="Switch Language: Hindi / English">HIN/ENG</button>
          <span class="radio-sep">/</span>
          <span id="radio-track-title" class="slowroads-track-text">Dil Ne Yeh Kaha — Udit Narayan (90s)</span>
          <div class="slowroads-radio-btns">
            <button id="btn-radio-prev" class="slowroads-text-btn" title="Previous">PREV</button>
            <button id="btn-radio-play" class="slowroads-text-btn play-btn" title="Play / Pause">PLAY</button>
            <button id="btn-radio-next" class="slowroads-text-btn" title="Next">NEXT</button>
          </div>
          <!-- Hidden equalizer for headless sound engine -->
          <div id="radio-eq" style="display:none;"><span></span><span></span><span></span><span></span></div>
        </div>

        <div class="slowroads-sys-btns">
          <button id="btn-hud-tod" class="slowroads-icon-btn" title="Cycle Time of Day [T]">TOD</button>
          <button id="btn-hud-camera" class="slowroads-icon-btn" title="Camera Mode [C]">CAM</button>
          <button id="btn-hud-radio-mute" class="slowroads-icon-btn" title="Toggle Radio [M]">RADIO</button>
          <button id="btn-hud-sfx-mute" class="slowroads-icon-btn" title="Toggle SFX [N]">SFX</button>
          <button id="btn-hud-sound" class="slowroads-icon-btn" title="Toggle All Audio" style="display:none;">MUTE</button>
        </div>
      </div>

      <!-- Touch Controls: shown only on touch/coarse-pointer devices (see
           applyTouchControlVisibility in game.js). Wired to the exact same
           this.keys.* flags the keyboard handlers set. -->
      <div id="touch-controls" class="touch-controls" aria-hidden="true">
        <div class="touch-steer-cluster">
          <button id="touch-steer-left" class="touch-btn touch-steer-btn" aria-label="Steer Left">◀</button>
          <button id="touch-steer-right" class="touch-btn touch-steer-btn" aria-label="Steer Right">▶</button>
        </div>
        <div class="touch-pedal-cluster">
          <button id="touch-pedal-gas" class="touch-btn touch-pedal-btn touch-pedal-gas" aria-label="Accelerate">▲</button>
          <button id="touch-pedal-brake" class="touch-btn touch-pedal-btn touch-pedal-brake" aria-label="Brake / Reverse">▼</button>
        </div>
      </div>

      <!-- Bottom-Right: Event Notifications (above Telemetry) -->
      <div class="notification-panel" id="notification-panel">
        <div class="notification-stack" id="notification-stack"></div>
      </div>

      <!-- Bottom-Right: Slowroads Clean Telemetry Readout -->
      <div class="slowroads-telemetry-box">
        <div class="telemetry-controls-col">
          <button id="btn-hud-autodrive" class="slowroads-pill-btn" title="Autopilot [F]">
            <span class="slowroads-dot"></span>
            <span id="autodrive-text">AUTOPILOT</span>
          </button>
          <button id="btn-hud-reset" class="slowroads-pill-btn" title="Recenter [R]">
            <span>RECENTER</span>
          </button>
        </div>

        <div class="telemetry-digits-box">
          <div class="telemetry-speed-row">
            <span id="telemetry-speed" class="telemetry-numeral">00</span>
            <span class="telemetry-unit">KM/H</span>
          </div>
          <div class="telemetry-sub-row">
            <span class="telemetry-gear">DRIVE</span>
            <span class="meta-sep">/</span>
            <span id="telemetry-distance" class="telemetry-trip">0.0 KM</span>
          </div>
          <!-- Hidden arc for telemetry loop -->
          <svg style="display:none;"><circle id="speed-arc-fill" /></svg>
        </div>
      </div>

      <!-- Hidden hook targets to keep game.js telemetry updates running cleanly -->
      <div class="hud-headless-hooks" style="display:none !important;" aria-hidden="true">
        <span id="order-id-label"></span>
        <span id="order-difficulty-pill"></span>
        <div id="order-timer-bar"></div>
        <div id="hud-health-pill"><div id="hud-health-fill"></div><span id="hud-health-text"></span></div>
        <div id="hud-climate-pill"><span id="climate-status"></span></div>
        <span id="hud-earnings"></span>
        <div id="hud-streak-pill"></div>
        <span id="delivery-count"></span>
        <div id="waypoint-hud-arrow"><span id="waypoint-target-text"></span></div>
      </div>

      <div id="score-popup-container" class="score-popup-container"></div>
    </div>

    <!-- Shiplyp Dispatch Dock (Clean Slowroads Minimalist Navigation Bar) -->
    <div id="slowroads-dock" class="slowroads-dock" style="display: none;">
      <!-- Dock Popup Panels -->
      <div id="dock-panel" class="dock-panel-container" style="display: none;"></div>

      <div class="dock-bar-glass">
        <div class="dock-nav-items">
          <button class="dock-tab-btn" data-panel="world">WORLD</button>
          <button class="dock-tab-btn" data-panel="style">ENVIRONMENT</button>
          <button class="dock-tab-btn" data-panel="vehicle">VEHICLE</button>
        </div>

        <div class="dock-icons-right">
          <button id="btn-dock-tod" class="dock-icon" title="Time of Day [T]">TOD</button>
          <button id="btn-dock-camera" class="dock-icon" title="Switch Camera Mode [C]">CAM</button>
          <button id="btn-dock-sound" class="dock-icon" title="Mute/Unmute Audio [M]">AUDIO</button>
          <button id="btn-dock-settings" class="dock-icon" title="Settings">CONFIG</button>
        </div>
      </div>
    </div>

    <!-- Modals (Dispatch Hub, Shift Completed Report, Settings) -->
    <div id="modal-container"></div>
  </div>

  <!-- Main Game Engine Bundle with Absolute Cache Busting -->
  <script>
    const s = document.createElement('script');
    s.src = 'game.js?t=' + Date.now();
    s.onload = () => {
      if (window.location.search.includes('test=1')) {
        const d = document.createElement('script');
        d.src = 'dev-checks.js?t=' + Date.now();
        d.onload = async () => {
          // Wait for game to initialize and world to build
          for (let i = 0; i < 40; i++) {
            if (window.game && window.game.world) break;
            if (!window.game && typeof ShiplypEngine !== 'undefined') {
              try { window.game = new ShiplypEngine(); } catch(e) {}
            }
            await new Promise(r => setTimeout(r, 100));
          }
          if (window.game && window.game.gameState === 'menu' && typeof window.game.startDrive === 'function') {
            window.game.startDrive();
          }
          await new Promise(r => setTimeout(r, 600));
          const res = typeof runWorldChecks === 'function' ? runWorldChecks() : [];
          const testDiv = document.createElement('pre');
          testDiv.id = 'automated-test-results';
          testDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0a;color:#eee;z-index:99999999;padding:20px;overflow:auto;font-family:monospace;font-size:13px;';
          let out = '=== AUTOMATED TEST SUITE REPORT ===\n\n';
          let pass = 0;
          res.forEach(r => {
            if (r.pass) pass++;
            out += `[${r.pass ? 'PASS' : 'FAIL'}] ${r.name}: ${r.detail || ''}\n`;
          });
          out += `\nSUMMARY: ${pass}/${res.length} WORLD REGRESSION CHECKS PASSED\n\n`;
          out += '=== RADIO CHANNEL VERIFICATION ===\n';
          out += `Initial: ${sound.getChannelDisplayName()} (${sound.activePlaylist.length} tracks)\n`;
          const c1 = sound.cycleChannel();
          out += `Cycle 1: ${sound.getChannelDisplayName()} (${sound.activePlaylist.length} tracks) -> ${c1}\n`;
          const c2 = sound.cycleChannel();
          out += `Cycle 2: ${sound.getChannelDisplayName()} (${sound.activePlaylist.length} tracks) -> ${c2}\n`;
          const c3 = sound.cycleChannel();
          out += `Cycle 3: ${sound.getChannelDisplayName()} (${sound.activePlaylist.length} tracks) -> ${c3}\n`;
          out += '\n=== ALL AUTOMATED CHECKS COMPLETE ===\n';
          testDiv.textContent = out;
          document.body.appendChild(testDiv);
          
          try {
            fetch('/test-report', { method: 'POST', body: JSON.stringify({ results: res, summary: out }) });
          } catch(e) {}
        };
        document.body.appendChild(d);
      }
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
